apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-time-deploy-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-time-pod
  template:
    metadata:
      labels:
        app: delivery-time-pod
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""  # Ensures pods only go to worker nodes
      containers:
      - name: delivery-time
        image: delivery_time:v2
        imagePullPolicy: Never
        env:
        - name: DAGSHUB_USER_TOKEN
          valueFrom:
            secretKeyRef:
              name: dagshub-secret
              key: my_key
        resources:
          limits:
            memory: "600Mi"
            cpu: "250m"
        ports:
        - containerPort: 8000


---


apiVersion: v1
kind: Service
metadata:
  name: delivery-time-service
spec:
  # type: NodePort
  selector:
    app: delivery-time-pod
  ports:
  - port: 1234
    targetPort: 8000
    # nodePort: 30001